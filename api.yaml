          "externalId": {
            "type": "string",
            "example": "1517290",
            "description": "Внешний ID (Steam/KupiKod)"
          },
          "year": {
            "type": "number",
            "example": 2021,
            "description": "Год релиза"
          },
          "genres": {
            "type": "array",
            "description": "Жанры игры",
            "items": {
              "type": "string",
              "enum": [
                "action",
                "adventure",
                "rpg",
                "strategy",
                "shooter",
                "simulation",
                "survival",
                "sports",
                "racing",
                "indie",
                "horror"
